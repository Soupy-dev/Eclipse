name: tvOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "tvOS CFBundleVersion. Integer 1-9999; must be greater than the checked-in app build."
        required: true
      upload:
        description: "Validate and upload the exported tvOS IPA to App Store Connect."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tvos-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Test, archive, and optionally upload tvOS
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: macos-26
    timeout-minutes: 150
    environment: tvos-testflight

    env:
      APP_NAME: ${{ vars.TVOS_APP_NAME || 'Eclipse' }}
      BUNDLE_IDENTIFIER: ${{ vars.TVOS_BUNDLE_IDENTIFIER || 'app.Eclipse.Soupy' }}
      DEVELOPMENT_TEAM: ${{ vars.TVOS_DEVELOPMENT_TEAM || 'ANMK3Y568U' }}
      ICLOUD_CONTAINER_ID: ${{ vars.TVOS_ICLOUD_CONTAINER_ID || 'iCloud.Eclipse.Soupy' }}
      PROJECT_PATH: Eclipse.xcodeproj
      SCHEME: Eclipse-tvOS

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate immutable MPVKit revision
        env:
          MPVKIT_SOURCE_REVISION: ${{ vars.MPVKIT_SOURCE_REVISION }}
        run: |
          set -euo pipefail

          if ! [[ "$MPVKIT_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::MPVKIT_SOURCE_REVISION must be an explicitly reviewed lowercase 40-character commit SHA. Mutable MPVKit branches are not accepted."
            exit 1
          fi
      - name: Check out canonical MPVKit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Soupy-dev/MPVKit
          ref: ${{ vars.MPVKIT_SOURCE_REVISION }}
          path: MPVKit
      - name: Verify immutable MPVKit checkout
        env:
          MPVKIT_SOURCE_REVISION: ${{ vars.MPVKIT_SOURCE_REVISION }}
        run: test "$(git -C MPVKit rev-parse HEAD)" = "$MPVKIT_SOURCE_REVISION"
      - name: Expose sibling MPVKit package
        run: ln -sfn "$GITHUB_WORKSPACE/MPVKit" "$GITHUB_WORKSPACE/../MPVKit"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Validate release request and external configuration
        env:
          REQUEST_UPLOAD: ${{ inputs.upload }}
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TVOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.TVOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          TVOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.TVOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          TVOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.TVOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [[ "$REQUEST_UPLOAD" == "true" && "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Uploading is allowed only from the default branch 'refs/heads/$DEFAULT_BRANCH'; received '$RELEASE_REF'. Run with upload disabled to validate another branch."
            exit 1
          fi

          if ! [[ "$BUNDLE_IDENTIFIER" =~ ^[A-Za-z0-9][A-Za-z0-9-]*(\.[A-Za-z0-9][A-Za-z0-9-]*)+$ ]]; then
            echo "::error::TVOS_BUNDLE_IDENTIFIER '$BUNDLE_IDENTIFIER' is invalid."
            exit 1
          fi

          if ! [[ "$DEVELOPMENT_TEAM" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::TVOS_DEVELOPMENT_TEAM must be a 10-character Apple team identifier."
            exit 1
          fi

          for name in \
            TVOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            TVOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            TVOS_PROVISIONING_PROFILE_BASE64 \
            KEYCHAIN_PASSWORD \
            TMDB_API_KEY \
            ANILIST_CLIENT_ID \
            ANILIST_CLIENT_SECRET \
            TRAKT_CLIENT_ID \
            TRAKT_CLIENT_SECRET \
            MAL_CLIENT_ID \
            MAL_CLIENT_SECRET
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing from the protected tvos-testflight environment."
              exit 1
            fi
          done

      - name: Validate App Store Connect credentials
        if: ${{ inputs.upload }}
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          for name in \
            APP_STORE_CONNECT_API_KEY_P8 \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required when upload is enabled."
              exit 1
            fi
          done

      - name: Resolve build number
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          BUILD_NUMBER="${INPUT_BUILD_NUMBER:-}"
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error::Build number must be an integer from 1 through 9999 without leading zeroes. Received '$BUILD_NUMBER'."
            exit 1
          fi

          PROJECT_BUILD_FLOOR="$(
            agvtool what-version -terse 2>/dev/null \
              | awk 'BEGIN { maximum = 0 } /^[0-9]+$/ { if ($1 > maximum) maximum = $1 } END { print maximum }'
          )"
          python3 - "$BUILD_NUMBER" "$PROJECT_BUILD_FLOOR" <<'PY'
          import sys

          requested = int(sys.argv[1])
          checked_in = int(sys.argv[2])
          if requested <= checked_in:
              raise SystemExit(
                  f"error: tvOS build number {requested} must be greater than the checked-in build {checked_in}."
              )
          PY

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Create tvOS build configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          {
            printf 'APP_NAME = %s\n' "$APP_NAME"
            printf 'BUNDLE_IDENTIFIER = %s\n' "$BUNDLE_IDENTIFIER"
            printf 'DEVELOPMENT_TEAM = %s\n' "$DEVELOPMENT_TEAM"
            printf '%s\n' 'CODE_SIGN_ENTITLEMENTS = EclipseTV/EclipseTV.entitlements'
            printf 'ICLOUD_CONTAINER_ID = %s\n' "$ICLOUD_CONTAINER_ID"
            printf '%s\n' 'ICLOUD_CONTAINER_ENVIRONMENT = Production'
            printf '%s\n' 'ECLIPSE_DISTRIBUTION_CHANNEL = TestFlight'
            printf 'TMDB_API_KEY = %s\n' "$TMDB_API_KEY"
            printf 'ANILIST_CLIENT_ID = %s\n' "$ANILIST_CLIENT_ID"
            printf 'ANILIST_CLIENT_SECRET = %s\n' "$ANILIST_CLIENT_SECRET"
            printf '%s\n' 'ANILIST_REDIRECT_URI = luna:/$()/anilist-callback'
            printf 'TRAKT_CLIENT_ID = %s\n' "$TRAKT_CLIENT_ID"
            printf 'TRAKT_CLIENT_SECRET = %s\n' "$TRAKT_CLIENT_SECRET"
            printf '%s\n' 'TRAKT_REDIRECT_URI = luna:/$()/trakt-callback'
            printf 'MAL_CLIENT_ID = %s\n' "$MAL_CLIENT_ID"
            printf 'MAL_CLIENT_SECRET = %s\n' "$MAL_CLIENT_SECRET"
            printf '%s\n' 'MAL_REDIRECT_URI = luna:/$()/mal-callback'
          } > Build.local.xcconfig

      - name: Audit tvOS product boundary
        run: |
          set -euo pipefail

          test -f "Eclipse.xcodeproj/xcshareddata/xcschemes/Eclipse-tvOS.xcscheme"
          plutil -lint EclipseTV/Info.plist EclipseTV/EclipseTV.entitlements EclipseTV/PrivacyInfo.xcprivacy
          python3 - EclipseTV/Info.plist EclipseTV/PrivacyInfo.xcprivacy <<'PY'
          import collections
          import plistlib
          import sys
          import xml.etree.ElementTree as ET

          info_path, manifest_path = sys.argv[1:]
          info_dictionary = ET.parse(info_path).getroot().find("dict")
          if info_dictionary is None:
              raise SystemExit("error: tvOS Info.plist does not contain a top-level dictionary.")
          info_keys = [
              element.text
              for element in info_dictionary
              if element.tag == "key" and element.text
          ]
          duplicate_info_keys = sorted(
              key for key, count in collections.Counter(info_keys).items() if count > 1
          )
          if duplicate_info_keys:
              raise SystemExit(
                  "error: tvOS Info.plist contains duplicate top-level key(s): "
                  + ", ".join(duplicate_info_keys)
              )

          with open(manifest_path, "rb") as handle:
              manifest = plistlib.load(handle)

          if manifest.get("NSPrivacyTracking") is not False:
              raise SystemExit("error: tvOS privacy manifest must declare NSPrivacyTracking=false.")
          if manifest.get("NSPrivacyCollectedDataTypes") != []:
              raise SystemExit("error: tvOS privacy manifest must contain an empty NSPrivacyCollectedDataTypes array.")

          required = {
              "NSPrivacyAccessedAPICategoryUserDefaults": {"CA92.1"},
              "NSPrivacyAccessedAPICategorySystemBootTime": {"35F9.1"},
              "NSPrivacyAccessedAPICategoryFileTimestamp": {"C617.1"},
              "NSPrivacyAccessedAPICategoryDiskSpace": {"E174.1"},
          }
          declared = {
              entry.get("NSPrivacyAccessedAPIType"): set(entry.get("NSPrivacyAccessedAPITypeReasons", []))
              for entry in manifest.get("NSPrivacyAccessedAPITypes", [])
              if isinstance(entry, dict)
          }
          for category, reasons in required.items():
              missing = reasons - declared.get(category, set())
              if missing:
                  raise SystemExit(
                      f"error: tvOS privacy manifest is missing {category} reason(s) {', '.join(sorted(missing))}."
                  )
          PY
          srcroot="$PWD"
          project_file="$PROJECT_PATH/project.pbxproj"

          python3 - "$project_file" <<'PY'
          import json
          import subprocess
          import sys

          project_file = sys.argv[1]
          raw = subprocess.check_output(["plutil", "-convert", "json", "-o", "-", project_file])
          objects = json.loads(raw)["objects"]

          target_id, target = next(
              (identifier, value)
              for identifier, value in objects.items()
              if value.get("isa") == "PBXNativeTarget" and value.get("name") == "Eclipse-tvOS"
          )

          source_phase = next(
              objects[phase_id]
              for phase_id in target.get("buildPhases", [])
              if objects[phase_id].get("isa") == "PBXSourcesBuildPhase"
          )

          resource_phase = next(
              objects[phase_id]
              for phase_id in target.get("buildPhases", [])
              if objects[phase_id].get("isa") == "PBXResourcesBuildPhase"
          )

          parents = {}
          for group_id, group in objects.items():
              if group.get("isa") != "PBXGroup":
                  continue
              for child_id in group.get("children", []):
                  parents[child_id] = group_id

          def resolved_path(file_id):
              node = objects[file_id]
              parts = [node.get("path") or node.get("name") or ""]
              cursor = parents.get(file_id)
              while cursor:
                  group = objects[cursor]
                  if group.get("sourceTree") == "<group>" and group.get("path"):
                      parts.append(group["path"])
                  cursor = parents.get(cursor)
              return "/".join(reversed([part for part in parts if part]))

          forbidden_exact = {
              "Eclipse/Models/DownloadManager.swift",
              "Eclipse/Models/HLSDownloader.swift",
              "Eclipse/Models/BackupManager.swift",
              "Eclipse/Logger/ReaderLogger.swift",
              "Eclipse/Views/DownloadsView.swift",
              "Eclipse/Views/DownloadedShowDetailView.swift",
              "Eclipse/Views/SettingsView/BackupManagementView.swift",
              "Eclipse/Views/SettingsView/ReaderLoggerView.swift",
              "Eclipse/Views/SettingsView/StorageView.swift",
              "Eclipse/JSLoader/SkyStream/SkyStreamRuntime.swift",
              "Eclipse/JSLoader/SkyStream/SkyStreamResolver.swift",
              "Eclipse/JSLoader/SkyStream/SkyStreamPackageValidator.swift",
              "Eclipse/JSLoader/SkyStream/SkyStreamVODValidator.swift",
              "Eclipse/JSLoader/SkyStream/SkyStreamManagerView.swift",
              "Eclipse/Views/SettingsView/NuvioPluginManagerView.swift",
              "Eclipse/Views/SettingsView/NuvioScraperSettingsView.swift",
              "Eclipse/Localizable.xcstrings",
          }

          forbidden_prefixes = (
              "Kanzen/",
              "Eclipse/JSLoader/Nuvio/",
              "Eclipse/Legal/ReaderExtensions",
          )

          violations = []
          for build_file_id in source_phase.get("files", []):
              file_id = objects[build_file_id].get("fileRef")
              if not file_id:
                  continue
              path = resolved_path(file_id)
              if path.startswith(forbidden_prefixes) or path in forbidden_exact:
                  violations.append(path)

          resource_paths = set()
          for build_file_id in resource_phase.get("files", []):
              file_id = objects[build_file_id].get("fileRef")
              if not file_id:
                  continue
              path = resolved_path(file_id)
              resource_paths.add(path)
              if path.startswith(forbidden_prefixes) or path in forbidden_exact:
                  violations.append(path)

          for required_resource in (
              "EclipseTV/Localizable.xcstrings",
              "Eclipse/Legal/OpenSourceLicenses",
          ):
              if required_resource not in resource_paths:
                  violations.append(f"missing:{required_resource}")

          for dependency_id in target.get("packageProductDependencies", []):
              product = objects[dependency_id].get("productName", "")
              if product in {"AidokuRunner", "AsyncDisplayKit", "FakeWebKit", "Nuke", "ZIPFoundation"}:
                  violations.append(f"package:{product}")

          for identifier, node in objects.items():
              if node.get("isa") == "XCRemoteSwiftPackageReference" and "aidokurunner" in node.get("repositoryURL", "").lower():
                  violations.append(f"project-package:{node.get('repositoryURL')}")
              if node.get("isa") == "XCSwiftPackageProductDependency" and node.get("productName") == "AidokuRunner":
                  violations.append("project-product:AidokuRunner")

          if violations:
              print("error: Eclipse-tvOS contains forbidden reader/download/plugin-runtime/private-browser membership:")
              for violation in sorted(set(violations)):
                  print(f"error:   {violation}")
              raise SystemExit(1)

          print("Eclipse-tvOS project membership passed")
          PY

          python3 - "$srcroot/Eclipse/Localizable.xcstrings" "$srcroot/EclipseTV/Localizable.xcstrings" <<'PY'
          import json
          import re
          import sys

          source_path, tv_path = sys.argv[1:]
          try:
              with open(source_path, encoding="utf-8") as source_file:
                  source = json.load(source_file)
              with open(tv_path, encoding="utf-8") as tv_file:
                  tv = json.load(tv_file)
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f"error: could not read curated tvOS localization catalog: {error}")

          blocked = re.compile(r"reader|manga|kanzen|aidoku|download", re.IGNORECASE)
          expected = {
              key: value
              for key, value in source.get("strings", {}).items()
              if not blocked.search(key + " " + json.dumps(value, ensure_ascii=False))
          }

          if tv.get("sourceLanguage") != source.get("sourceLanguage") or tv.get("strings") != expected:
              raise SystemExit(
                  "error: EclipseTV/Localizable.xcstrings is stale; regenerate it from the shared catalog while excluding reader/download entries."
              )
          PY

          echo "Eclipse-tvOS membership audit passed"

          if ! xcodebuild -list -project "$PROJECT_PATH" | grep -Fq "$SCHEME"; then
            echo "::error::The shared $SCHEME scheme is missing."
            exit 1
          fi

      - name: Resolve Swift packages and audit MPVKit
        run: |
          set -euo pipefail

          RESOLVED="Eclipse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          SOURCE_PACKAGES_DIR="$RUNNER_TEMP/SourcePackages"

          if [[ ! -f "$RESOLVED" ]]; then
            echo "::error::Package.resolved is required for a reproducible tvOS release."
            exit 1
          fi

          rm -rf "$SOURCE_PACKAGES_DIR"
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation

          MPVKIT_CHECKOUT="$GITHUB_WORKSPACE/MPVKit"
          if [[ ! -f "$MPVKIT_CHECKOUT/Package.swift" ]]; then
            echo "::error::The canonical MPVKit checkout was not found."
            exit 1
          fi

          RESOLVED_MPVKIT_REVISION=$(git -C "$MPVKIT_CHECKOUT" rev-parse HEAD)
          if ! [[ "$RESOLVED_MPVKIT_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The canonical MPVKit checkout does not have an immutable revision."
            exit 1
          fi

          checkout="$MPVKIT_CHECKOUT"
          package_file="${checkout}/Package.swift"
          gpu_renderer="${checkout}/Sources/MPVKitSampleBufferGPL/MPVGPUPlayerRenderer.swift"
          sample_buffer_renderer="${checkout}/Sources/MPVKitSampleBufferGPL/MPVMetalSampleBufferRenderer.swift"

          for required_file in "$package_file" "$gpu_renderer" "$sample_buffer_renderer"; do
              if [[ ! -f "$required_file" ]]; then
                  echo "::error::MPVKit checkout is missing ${required_file#"${checkout}/"}."
                  exit 1
              fi
          done

          mpvkit_failures=()

          if ! grep -Eq 'linkedFramework\("UIKit",[[:space:]]*\.when\(platforms:[[:space:]]*\[[^]]*\.tvOS[^]]*\]\)\)' "$package_file"; then
              mpvkit_failures+=("Package.swift does not link UIKit for tvOS")
          fi

          if ! grep -Eq '#if[[:space:]]+os\(iOS\)[[:space:]]*\|\|[[:space:]]*os\(tvOS\)' "$gpu_renderer"; then
              mpvkit_failures+=("MPVGPUPlayerRenderer still resolves to its unsupported-platform tvOS stub")
          fi

          if ! grep -Eq '#if[[:space:]]+os\(iOS\)[[:space:]]*\|\|[[:space:]]*os\(tvOS\)' "$sample_buffer_renderer"; then
              mpvkit_failures+=("MPVMetalSampleBufferRenderer still resolves to its unsupported-platform tvOS stub")
          fi

          if ! grep -Fq 'estimatedFramesPerSecond' "$gpu_renderer"; then
              mpvkit_failures+=("MPV renderer diagnostics do not expose source frame cadence for Match Content")
          fi

          if ! grep -Fq 'videoCodec' "$gpu_renderer"; then
              mpvkit_failures+=("MPV renderer diagnostics do not expose source codec metadata for Match Content")
          fi

          source_packages=$(cd "${checkout}/../.." 2>/dev/null && pwd || true)
          artifact_roots=("${SOURCE_PACKAGES_DIR}/artifacts" "${checkout}/.build/artifacts")
          if [[ -n "$source_packages" ]]; then
              artifact_roots+=("${source_packages}/artifacts")
          fi

          uavs3d_binary=""
          libmpv_artifact=""
          for root in "${artifact_roots[@]}"; do
              [[ -d "$root" ]] || continue
              if [[ -z "$uavs3d_binary" ]]; then
                  uavs3d_binary=$(find "$root" \
                      -path '*Libuavs3d.xcframework/tvos-arm64_x86_64-simulator/Libuavs3d.framework/Libuavs3d' \
                      -type f -print -quit)
              fi
              if [[ -z "$libmpv_artifact" ]]; then
                  libmpv_info=$(find "$root" -path '*Libmpv.xcframework/Info.plist' -type f -print -quit)
                  if [[ -n "$libmpv_info" ]]; then
                      libmpv_artifact=${libmpv_info%/Info.plist}
                  fi
              fi
              [[ -n "$uavs3d_binary" && -n "$libmpv_artifact" ]] && break
          done

          if [[ -z "$uavs3d_binary" ]]; then
              mpvkit_failures+=("resolved Libuavs3d tvOS artifact was not available for its deployment-target audit")
          elif ! python3 - "$uavs3d_binary" <<'PY'
          import re
          import subprocess
          import sys

          output = subprocess.check_output(
              ["xcrun", "otool", "-l", "-arch", "arm64", sys.argv[1]],
              text=True,
              stderr=subprocess.DEVNULL,
          )
          versions = [tuple(map(int, value.split("."))) for value in re.findall(r"\bminos\s+([0-9]+(?:\.[0-9]+)*)", output)]
          raise SystemExit(0 if versions and max(versions) <= (17, 5) else 1)
          PY
          then
              mpvkit_failures+=("Libuavs3d contains tvOS simulator objects requiring newer than the app's 17.5 deployment target")
          fi

          if [[ -z "$libmpv_artifact" ]]; then
              mpvkit_failures+=("resolved Libmpv tvOS artifact was not available for its native-export audit")
          elif ! python3 - "$libmpv_artifact" <<'PY'
          import pathlib
          import plistlib
          import re
          import subprocess
          import sys

          artifact = pathlib.Path(sys.argv[1])
          with (artifact / "Info.plist").open("rb") as stream:
              libraries = plistlib.load(stream).get("AvailableLibraries", [])
          required_symbols = (
              "mpv_apple_pip_api_version",
              "mpv_apple_pip_get_capabilities",
              "mpv_apple_pip_set_callback",
              "mpv_apple_pip_set_mode",
              "mpv_apple_pip_submit_target",
              "mpv_apple_pip_disable_and_drain",
              "mpv_apple_audiounit_recovery_count",
          )
          failures = []
          for variant, required_architectures in (("", {"arm64"}), ("simulator", {"arm64", "x86_64"})):
              slices = [
                  library for library in libraries
                  if library.get("SupportedPlatform") == "tvos"
                  and library.get("SupportedPlatformVariant", "") == variant
                  and required_architectures.issubset(set(library.get("SupportedArchitectures", [])))
              ]
              label = "simulator" if variant else "device"
              if len(slices) != 1:
                  failures.append(f"Libmpv must have one complete tvOS {label} slice")
                  continue
              library = slices[0]
              framework = artifact / library["LibraryIdentifier"] / library["LibraryPath"]
              binary = framework / framework.stem
              for architecture in library["SupportedArchitectures"]:
                  result = subprocess.run(
                      ["xcrun", "nm", "-arch", architecture, "-m", "-gU", str(binary)],
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode != 0:
                      failures.append(f"Libmpv tvOS {label} {architecture} could not be audited")
                      continue
                  for symbol in required_symbols:
                      definitions = [
                          line for line in result.stdout.splitlines()
                          if re.search(r"\s_?" + re.escape(symbol) + r"$", line)
                      ]
                      if not any(
                          " external " in line and "weak" not in line and "undefined" not in line
                          for line in definitions
                      ):
                          failures.append(f"Libmpv tvOS {label} {architecture} lacks strong native export '{symbol}'")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          PY
          then
              mpvkit_failures+=("Libmpv tvOS device or simulator native-export audit failed")
          fi

          if (( ${#mpvkit_failures[@]} > 0 )); then
              echo "::error::the resolved MPVKit checkout is not release-compatible with Eclipse-tvOS:"
              for failure in "${mpvkit_failures[@]}"; do
                  echo "::error::  $failure"
              done
              echo "::error::Provide the reviewed MPVKit source and matching tvOS 17.5-compatible private runtime before running the tvOS release lane."
              exit 1
          fi

          mpvkit_revision=$(git -C "$checkout" rev-parse HEAD 2>/dev/null || true)
          if [[ -n "$mpvkit_revision" ]]; then
              echo "MPVKit tvOS renderer audit passed at revision $mpvkit_revision"
          else
              echo "MPVKit tvOS renderer audit passed"
          fi

          {
            echo "SOURCE_PACKAGES_DIR=$SOURCE_PACKAGES_DIR"
            echo "MPVKIT_REVISION=$RESOLVED_MPVKIT_REVISION"
          } >> "$GITHUB_ENV"

      - name: Select tvOS simulator
        run: |
          set -euo pipefail

          TVOS_SIMULATOR_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          candidates = [
              device
              for runtime, entries in devices.items()
              if "tvOS" in runtime or "AppleTVOS" in runtime
              for device in entries
              if device.get("isAvailable") and "Apple TV" in device.get("name", "")
          ]
          if not candidates:
              raise SystemExit("No available tvOS simulator is installed")
          preferred = next((item for item in candidates if "4K (3rd generation)" in item["name"]), candidates[0])
          print(preferred["udid"])
          ')

          echo "TVOS_SIMULATOR_UDID=$TVOS_SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Run tvOS unit and remote UI tests
        run: |
          set -euo pipefail

          for test_directory in EclipseTVTests EclipseTVUITests; do
            if [[ ! -d "$GITHUB_WORKSPACE/$test_directory" ]] ||
               [[ -z "$(git ls-files -- "$test_directory/*.swift")" ]]; then
              echo "::error::Required tracked tvOS test sources are missing from $test_directory."
              exit 1
            fi
          done

          RESULT_BUNDLE_PATH="$RUNNER_TEMP/Eclipse-tvOS.xcresult"
          rm -rf "$RESULT_BUNDLE_PATH"

          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=tvOS Simulator,id=$TVOS_SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Automatic \
            PROVISIONING_PROFILE_SPECIFIER=

          echo "RESULT_BUNDLE_PATH=$RESULT_BUNDLE_PATH" >> "$GITHUB_ENV"

      - name: Install and validate tvOS signing assets
        env:
          TVOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.TVOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          TVOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.TVOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          TVOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.TVOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/tvos-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/tvos-app-store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/tvos-app-store-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/eclipse-tvos-signing.keychain-db"

          printf '%s' "$TVOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$TVOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          python3 - "$PROFILE_PLIST" "$DEVELOPMENT_TEAM" "$BUNDLE_IDENTIFIER" "$ICLOUD_CONTAINER_ID" <<'PY'
          import datetime
          import plistlib
          import sys

          profile_path, team_id, bundle_id, container_id = sys.argv[1:]
          with open(profile_path, "rb") as handle:
              profile = plistlib.load(handle)

          entitlements = profile.get("Entitlements", {})

          def values(value):
              if value is None:
                  return []
              return value if isinstance(value, list) else [value]

          errors = []
          if team_id not in values(profile.get("TeamIdentifier")):
              errors.append("profile team does not match TVOS_DEVELOPMENT_TEAM")
          if entitlements.get("application-identifier") != f"{team_id}.{bundle_id}":
              errors.append("profile application identifier does not match the tvOS bundle id")
          if not any(item in {"tvOS", "AppleTVOS"} for item in values(profile.get("Platform"))):
              errors.append("profile is not a tvOS provisioning profile")
          if container_id not in values(entitlements.get("com.apple.developer.icloud-container-identifiers")):
              errors.append("profile does not include the Eclipse iCloud container")
          if "CloudKit" not in values(entitlements.get("com.apple.developer.icloud-services")):
              errors.append("profile does not include CloudKit")
          if "runs-as-current-user-with-user-independent-keychain" not in values(entitlements.get("com.apple.developer.user-management")):
              errors.append("profile does not include the current-user data-isolation entitlement")
          environment = entitlements.get("com.apple.developer.icloud-container-environment")
          if environment is not None and "Production" not in values(environment):
              errors.append("profile does not permit the CloudKit Production environment")
          if entitlements.get("get-task-allow") is True:
              errors.append("profile permits debugging and is not an App Store distribution profile")
          if profile.get("ProvisionsAllDevices") or profile.get("ProvisionedDevices"):
              errors.append("profile is an ad hoc/development profile, not an App Store profile")
          if entitlements.get("beta-reports-active") is not True:
              errors.append("profile is not enabled for TestFlight beta reporting")

          expiration = profile.get("ExpirationDate")
          if not isinstance(expiration, datetime.datetime):
              errors.append("profile expiration date is missing")
          else:
              if expiration.tzinfo is None:
                  expiration = expiration.replace(tzinfo=datetime.timezone.utc)
              if expiration <= datetime.datetime.now(datetime.timezone.utc):
                  errors.append("profile is expired")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              raise SystemExit(1)
          PY

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$TVOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq 'Apple Distribution'; then
            echo "::error::The p12 does not contain a valid Apple Distribution identity."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME<<PROFILE_NAME_EOF"
            echo "$PROFILE_NAME"
            echo "PROFILE_NAME_EOF"
          } >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        if: ${{ inputs.upload }}
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          API_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$(dirname "$API_KEY_PATH")"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          {
            echo "API_PRIVATE_KEYS_DIR=$(dirname "$API_KEY_PATH")"
            echo "API_KEY_PATH=$API_KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Archive signed tvOS app
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/$APP_NAME-tvOS.xcarchive"
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData-tvOS"
          MPVKIT_SOURCE_REVISION="$(git -C "$GITHUB_WORKSPACE/MPVKit" rev-parse HEAD)"
          rm -rf "$ARCHIVE_PATH" "$DERIVED_DATA_PATH"

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=tvOS" \
            -sdk appletvos \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ECLIPSE_SOURCE_REVISION="$GITHUB_SHA" \
            ECLIPSE_MPVKIT_SOURCE_REVISION="$MPVKIT_SOURCE_REVISION" \
            ECLIPSE_DISTRIBUTION_CHANNEL=TestFlight \
            ICLOUD_CONTAINER_ENVIRONMENT=Production \
            ECLIPSE_TVOS_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            ECLIPSE_TVOS_DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            ECLIPSE_TVOS_CODE_SIGN_STYLE=Manual \
            ECLIPSE_TVOS_CODE_SIGN_IDENTITY="Apple Distribution" \
            ECLIPSE_TVOS_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          license_source_directory="$PWD/Eclipse/Legal/OpenSourceLicenses"
          if [[ ! -s "$license_source_directory/THIRD-PARTY-NOTICES.txt" ]]; then
              echo "::error::tracked third-party notices are missing or empty."
              exit 1
          fi
          for license_source in "$license_source_directory"/*.txt; do
              license_name=${license_source##*/}
              license_bundle="$APP_PATH/OpenSourceLicenses/$license_name"
              if [[ ! -s "$license_bundle" ]] || ! cmp -s "$license_source" "$license_bundle"; then
                  echo "::error::archived tvOS license document '$license_name' is missing, empty, or differs from its source."
                  exit 1
              fi
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print EclipseSourceRevision' "$APP_PATH/Info.plist")" = "$GITHUB_SHA"
          test "$(/usr/libexec/PlistBuddy -c 'Print EclipseMPVKitSourceRevision' "$APP_PATH/Info.plist")" = "$MPVKIT_SOURCE_REVISION"

          audit_tvos_binary() {
              for candidate in "$@"; do
                  if [[ ! -f "$candidate" ]]; then
                      echo "::error::tvOS binary audit input does not exist: $candidate"
                      exit 1
                  fi

                  if ! file "$candidate" | grep -Fq 'Mach-O'; then
                      continue
                  fi

                  linked_frameworks=$(otool -L "$candidate" 2>/dev/null || true)
                  if grep -Eq '/WebKit\.framework/|/JavaScriptCore\.framework/.*UIWebView' <<< "$linked_frameworks"; then
                      echo "::error::private-browser WebKit linkage found in $(basename "$candidate")."
                      exit 1
                  fi

                  raw_forbidden=$(strings -a "$candidate" 2>/dev/null \
                      | grep -E 'UIWebView|FakeWebKit|AidokuRunner|ReaderExtension|ReaderSourceProvider|JavaScriptReaderProvider|NativeReaderProvider|AsyncDisplayKit|ReaderDownloadManager|DownloadManager|AVURLAssetHTTPHeaderFieldsKey' \
                      | head -n 5 \
                      || true)
                  if [[ -n "$raw_forbidden" ]]; then
                      echo "::error::forbidden reader/download/private-browser symbols found in $(basename "$candidate"):"
                      echo "$raw_forbidden"
                      exit 1
                  fi

                  symbol_dump=$(mktemp)
                  {
                      nm "$candidate" 2>/dev/null || true
                      strings -a "$candidate" 2>/dev/null || true
                  } | xcrun swift-demangle > "$symbol_dump"

                  # Keep the expressions module-qualified so SwiftUI.GeometryReader and
                  # third-party parser terms cannot create false positives.
                  swift_forbidden=$(grep -Ei \
                      'Eclipse\.TrackerManager.*manga|Eclipse\.EclipseTheme.*reader|Eclipse\.[A-Za-z0-9_]*(Manga|Kanzen|Aidoku|ReaderExtension|ReaderSourceProvider|JavaScriptReaderProvider|NativeReaderProvider|ReaderLogger|ReaderDownload)[A-Za-z0-9_]*|Eclipse\.(DownloadManager|HLSDownloader)|Eclipse\.(NuvioPlugin|NuvioProviderFetchSession|SkyStreamRuntimePool|SkyStreamProviderRuntime|SkyStreamResolver|SkyStreamPackageValidator|SkyStreamVODValidator|SkyStreamManagerView)[A-Za-z0-9_]*' \
                      "$symbol_dump" \
                      | head -n 10 \
                      || true)
                  rm -f "$symbol_dump"

                  if [[ -n "$swift_forbidden" ]]; then
                      echo "::error::reader/manga/download/plugin-runtime Swift symbols found in $(basename "$candidate"):"
                      echo "$swift_forbidden"
                      exit 1
                  fi
              done

              echo "tvOS binary audit passed"
          }

          archive_path="$ARCHIVE_PATH"
          expected_bundle_id="$BUNDLE_IDENTIFIER"
          expected_icloud_container="$ICLOUD_CONTAINER_ID"
          applications_path="${archive_path}/Products/Applications"

          if [[ ! -d "$applications_path" ]]; then
              echo "::error::archive does not contain Products/Applications."
              exit 1
          fi

          app_path=$(find "$applications_path" -maxdepth 1 -type d -name '*.app' -print -quit)
          if [[ -z "$app_path" ]]; then
              echo "::error::archive does not contain a tvOS app."
              exit 1
          fi

          info_plist="${app_path}/Info.plist"
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")
          executable_path="${app_path}/${executable_name}"

          read_plist() {
              /usr/libexec/PlistBuddy -c "Print :$1" "$info_plist"
          }

          require_equal() {
              local label=$1
              local actual=$2
              local expected=$3
              if [[ "$actual" != "$expected" ]]; then
                  echo "::error::$label is '$actual'; expected '$expected'."
                  exit 1
              fi
          }

          require_equal "bundle identifier" "$(read_plist CFBundleIdentifier)" "$expected_bundle_id"
          require_equal "archive platform" "$(read_plist DTPlatformName)" "appletvos"
          require_equal "supported platform" "$(read_plist 'CFBundleSupportedPlatforms:0')" "AppleTVOS"
          require_equal "device family" "$(read_plist 'UIDeviceFamily:0')" "3"
          require_equal "distribution channel" "$(read_plist EclipseDistributionChannel)" "TestFlight"

          for runtime_key in \
              TMDBAPIKey \
              AniListClientID \
              AniListClientSecret \
              AniListRedirectUri \
              TraktClientID \
              TraktClientSecret \
              TraktRedirectUri \
              MALClientID \
              MALClientSecret \
              MALRedirectUri
          do
              runtime_value=$(read_plist "$runtime_key" 2>/dev/null || true)
              if [[ -z "$runtime_value" || "$runtime_value" == *'$('* ]]; then
                  echo "::error::archived tvOS app is missing configured runtime value '$runtime_key'."
                  exit 1
              fi
          done

          device_family_count=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$info_plist" | grep -Ec '^[[:space:]]+[0-9]+$' || true)
          if [[ "$device_family_count" != "1" ]]; then
              echo "::error::tvOS archive must contain only device family 3."
              exit 1
          fi

          minimum_os=$(read_plist MinimumOSVersion)
          python3 - "$minimum_os" <<'PY'
          import sys

          def version(value):
              try:
                  return tuple(int(part) for part in value.split("."))
              except ValueError:
                  raise SystemExit(f"error: invalid MinimumOSVersion {value!r}")

          if version(sys.argv[1]) < version("17.5"):
              raise SystemExit(f"error: tvOS minimum version is {sys.argv[1]}; expected 17.5 or newer")
          PY

          read_plist 'CFBundleIcons:CFBundlePrimaryIcon' >/dev/null
          read_plist 'TVTopShelfImage:TVTopShelfPrimaryImage' >/dev/null
          read_plist 'TVTopShelfImage:TVTopShelfPrimaryImageWide' >/dev/null

          if [[ ! -f "${app_path}/Assets.car" ]]; then
              echo "::error::compiled tvOS app-icon/Top Shelf assets are missing."
              exit 1
          fi

          if [[ ! -f "${app_path}/PrivacyInfo.xcprivacy" ]]; then
              echo "::error::PrivacyInfo.xcprivacy is missing from the tvOS app."
              exit 1
          fi
          plutil -lint "${app_path}/PrivacyInfo.xcprivacy" >/dev/null
          python3 - "${app_path}/PrivacyInfo.xcprivacy" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as handle:
              manifest = plistlib.load(handle)

          required = {
              "NSPrivacyAccessedAPICategoryUserDefaults": {"CA92.1"},
              "NSPrivacyAccessedAPICategorySystemBootTime": {"35F9.1"},
              "NSPrivacyAccessedAPICategoryFileTimestamp": {"C617.1"},
              "NSPrivacyAccessedAPICategoryDiskSpace": {"E174.1"},
          }
          declared = {
              entry.get("NSPrivacyAccessedAPIType"): set(entry.get("NSPrivacyAccessedAPITypeReasons", []))
              for entry in manifest.get("NSPrivacyAccessedAPITypes", [])
              if isinstance(entry, dict)
          }
          for category, reasons in required.items():
              missing = reasons - declared.get(category, set())
              if missing:
                  raise SystemExit(
                      f"error: archived tvOS privacy manifest is missing {category} reason(s) {', '.join(sorted(missing))}."
                  )
          PY

          if [[ ! -x "$executable_path" ]]; then
              echo "::error::tvOS executable is missing."
              exit 1
          fi

          if [[ ! -f "${app_path}/embedded.mobileprovision" ]]; then
              echo "::error::archived tvOS app does not contain an embedded provisioning profile."
              exit 1
          fi

          if ! file "$executable_path" | grep -Fq 'arm64'; then
              echo "::error::generic tvOS archive does not contain an arm64 executable."
              exit 1
          fi

          signing_details=$(codesign -dv --verbose=4 "$app_path" 2>&1 || true)
          if ! grep -Fq 'Authority=Apple Distribution' <<< "$signing_details"; then
              echo "::error::archived tvOS app is not signed with an Apple Distribution certificate."
              exit 1
          fi

          entitlements_plist=$(mktemp)
          trap 'rm -f "$entitlements_plist"' EXIT
          if ! codesign -d --entitlements :- "$app_path" > "$entitlements_plist" 2>/dev/null; then
              echo "::error::signed tvOS app entitlements could not be read."
              exit 1
          fi
          plutil -lint "$entitlements_plist" >/dev/null

          entitlement_value() {
              /usr/libexec/PlistBuddy -c "Print :$1" "$entitlements_plist"
          }

          application_identifier=$(entitlement_value application-identifier)
          if [[ "$application_identifier" != *."$expected_bundle_id" ]]; then
              echo "::error::signed application identifier '$application_identifier' does not end in '.$expected_bundle_id'."
              exit 1
          fi

          require_equal \
              "CloudKit environment" \
              "$(entitlement_value 'com.apple.developer.icloud-container-environment')" \
              "Production"

          icloud_services=$(entitlement_value 'com.apple.developer.icloud-services')
          if ! grep -Fq 'CloudKit' <<< "$icloud_services"; then
              echo "::error::signed tvOS app does not include the CloudKit service entitlement."
              exit 1
          fi

          if [[ -n "$expected_icloud_container" ]]; then
              icloud_containers=$(entitlement_value 'com.apple.developer.icloud-container-identifiers')
              if ! grep -Fq "$expected_icloud_container" <<< "$icloud_containers"; then
                  echo "::error::signed tvOS app does not include iCloud container '$expected_icloud_container'."
                  exit 1
              fi
          fi

          user_management=$(entitlement_value 'com.apple.developer.user-management')
          if ! grep -Fq 'runs-as-current-user-with-user-independent-keychain' <<< "$user_management"; then
              echo "::error::signed tvOS app does not include current-user data isolation."
              exit 1
          fi

          # The entitlement permits an app to opt individual credentials into a shared,
          # user-independent Keychain. Eclipse intentionally never requests that option:
          # provider and tracker credentials must follow the active Apple TV user.
          if strings -a "$executable_path" | grep -Fq 'kSecUseUserIndependentKeychain'; then
              echo "::error::tvOS executable requests the user-independent Keychain."
              exit 1
          fi

          for forbidden_path in FakeWebKit AidokuRunner ReaderExtensions ReaderExtensionLicenses AsyncDisplayKit Texture ZIPFoundation Nuke; do
              if find "$app_path" -iname "*${forbidden_path}*" \
                  ! -path "$app_path/OpenSourceLicenses/Nuke-MIT.txt" \
                  ! -path "$app_path/OpenSourceLicenses/Texture-Apache-2.0.txt" \
                  ! -path "$app_path/OpenSourceLicenses/ZIPFoundation-MIT.txt" \
                  -print -quit | grep -q .; then
                  echo "::error::forbidden reader/private-browser component '$forbidden_path' is bundled in the tvOS app."
                  exit 1
              fi
          done

          while IFS= read -r -d '' localization_file; do
              localized_dump=$(plutil -p "$localization_file" 2>/dev/null || strings -a "$localization_file" 2>/dev/null || true)
              if grep -Eiq 'reader|manga|kanzen|aidoku|download' <<< "$localized_dump"; then
                  echo "::error::reader/download wording found in ${localization_file#"${app_path}/"}."
                  exit 1
              fi
          done < <(find "$app_path" -type f -name 'Localizable.strings' -print0)

          binary_candidates=()
          while IFS= read -r -d '' candidate; do
              if ! file "$candidate" | grep -Fq 'Mach-O'; then
                  continue
              fi
              binary_candidates+=("$candidate")
          done < <(find "$app_path" -type f -perm -111 -print0)

          audit_tvos_binary "${binary_candidates[@]}"

          echo "tvOS archive validation passed for $(basename "$app_path")"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export App Store tvOS IPA
        run: |
          set -euo pipefail

          EXPORT_DIR="$RUNNER_TEMP/tvos-testflight-export"
          EXPORT_OPTIONS="$RUNNER_TEMP/tvOS-ExportOptions.plist"
          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          python3 - "$EXPORT_OPTIONS" "$BUNDLE_IDENTIFIER" "$PROFILE_NAME" "$DEVELOPMENT_TEAM" <<'PY'
          import plistlib
          import sys

          output_path, bundle_id, profile_name, team_id = sys.argv[1:]
          options = {
              "method": "app-store-connect",
              "destination": "export",
              "distributionBundleIdentifier": bundle_id,
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": team_id,
              "provisioningProfiles": {bundle_id: profile_name},
              "iCloudContainerEnvironment": "Production",
              "manageAppVersionAndBuildNumber": False,
              "stripSwiftSymbols": True,
          }
          with open(output_path, "wb") as handle:
              plistlib.dump(options, handle, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

          plutil -lint "$EXPORT_OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$EXPORT_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation

          IPA_PATH=$(find "$EXPORT_DIR" -maxdepth 1 -type f -name '*.ipa' -print -quit)
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::No tvOS IPA was exported."
            find "$EXPORT_DIR" -maxdepth 2 -type f -print
            exit 1
          fi

          shasum -a 256 "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Validate and upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          xcrun altool --validate-app \
            --file "$IPA_PATH" \
            --api-key "$APP_STORE_CONNECT_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER_ID"

          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --api-key "$APP_STORE_CONNECT_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up signing and API credentials
        if: always()
        run: |
          set +e

          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [[ -n "${API_KEY_PATH:-}" ]]; then
            rm -f "$API_KEY_PATH"
          fi
          rm -f Build.local.xcconfig
